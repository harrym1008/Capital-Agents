    {% with show_token_metrics=True %}

    <div class="config-bar">

                <option value="short">Short (1wk & 1mo)</option>

            0 mins 0.00 secs
        </div>

    <div class="stages-bar" id="stagesBar">
        <!-- Stages will be populated dynamically -->
    </div>

    <div class="main-layout" style="display: flex; flex: 1; overflow: hidden; position: relative;">
        <div class="workspace">
            <div id="llamaLoadingContainer" class="llama-loader">
                <div class="llama-loader-title">
                    <span>Llama.cpp Process Output (Loading Server...)</span>
                    <span class="status-running" style="padding: 1px 4px; border-radius: 2px; font-size: 9px; color: #000;">BOOTING</span>
                </div>
                <pre id="llamaLoadingLogs" style="margin: 0; white-space: pre-wrap;"></pre>
            </div>

            <div class="panes-container" id="panesContainer">
                <!-- Dynamic workspace stages will go here -->

        </div>

        <!-- Collapsible Summary Sidebar -->
        <div id="summarySidebar" class="summary-sidebar collapsed">
            <div class="sidebar-header">
                <h3>Boardroom Summaries Log</h3>
            </div>
            <div id="sidebarContent" class="sidebar-content">
                <!-- Summaries will append here in order -->
            </div>
        </div>
    </div>

    <script>
        let serverIsLoaded = false;
        let activeAgentPanes = {}; // Map of "stageNum_agentRole" -> { pane, feed }
        let activeBlocks = {}; // Map of "stageNum_agentRole" -> { type, element, block }
        let currentStageNumber = 0;
        let timerInterval = null;
        let highestStageNumber = 0;
        let currentTicker = "NVDA";
        let currentSimulatedDate = null;

        function formatOrdinalDate(dateInput) {
            if (!dateInput) {
                dateInput = new Date().toISOString().split('T')[0];
            }
            let dateStr = String(dateInput).split('T')[0];
            const parts = dateStr.split('-');
            if (parts.length < 3) return dateStr;
            
            const year = parseInt(parts[0], 10);
            const monthIdx = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);
            
            const months = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];
            const monthName = months[monthIdx] || "";
            
            let suffix = "th";
            const lastTwo = day % 100;
            if (lastTwo < 11 || lastTwo > 13) {
                const lastDigit = day % 10;
                if (lastDigit === 1) suffix = "st";
                else if (lastDigit === 2) suffix = "nd";
                else if (lastDigit === 3) suffix = "rd";
            }
            
            return `${day}${suffix} ${monthName} ${year}`;
        }

        function parseMarkdown(text) {
            if (!text) return "";
            
            // 1. Parse tables
            const lines = text.split('\n');
            let inTable = false;
            let tableRows = [];
            let resultLines = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('|') && line.endsWith('|')) {
                    inTable = true;
                    tableRows.push(line);
                } else {
                    if (inTable) {
                        resultLines.push(renderHtmlTable(tableRows));
                        tableRows = [];
                        inTable = false;
                    }
                    resultLines.push(line);
                }
            }
            if (inTable) {
                resultLines.push(renderHtmlTable(tableRows));
            }
            
            let formattedText = resultLines.join('\n');
            
            // 2. Parse bold: **text** or __text__
            formattedText = formattedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formattedText = formattedText.replace(/__(.*?)__/g, '<strong>$1</strong>');
            
            // 3. Parse italic: *text* or _text_
            formattedText = formattedText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            formattedText = formattedText.replace(/_(.*?)_/g, '<em>$1</em>');

            // 4. Parse hashtag headings: # (H2) to ###### (H6)
            formattedText = formattedText.replace(/^######\s+(.*?)$/gm, '<h6 style="font-size: 15px; font-weight: bold; >$1</h6>');
            formattedText = formattedText.replace(/^#####\s+(.*?)$/gm, '<h6 style="font-size: 16px; font-weight: bold; ">$1</h6>');
            formattedText = formattedText.replace(/^####\s+(.*?)$/gm, '<h5 style="font-size: 17px; font-weight: bold; ">$1</h5>');
            formattedText = formattedText.replace(/^###\s+(.*?)$/gm, '<h4 style="font-size: 19px; font-weight: bold; ">$1</h4>');
            formattedText = formattedText.replace(/^##\s+(.*?)$/gm, '<h3 style="font-size: 21px; font-weight: bold; ">$1</h3>');
            formattedText = formattedText.replace(/^#\s+(.*?)$/gm, '<h2 style="font-size: 23px; font-weight: bold; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px;">$1</h2>');
            
            // 5. Parse horizontal rules: ---
            formattedText = formattedText.replace(/^---+\s*$/gm, '<hr style="border: none; border-top: 1.5px solid #cbd5e1; margin: 10px 0 3px 0;">');

            // 6. Parse backslash dollar signs: \$ -> $
            formattedText = formattedText.replace(/\\\$/g, '$');

            return formattedText;
        }

        function renderHtmlTable(rows) {
            if (rows.length === 0) return "";
            
            let html = '<table style="border-collapse: collapse; width: 100%; margin: 10px 0; border: 2px solid #cbd5e1;">';
            
            // Header row
            const firstRowCols = rows[0].split('|').map(c => c.trim()).filter((c, idx, arr) => idx > 0 && idx < arr.length - 1);
            html += '<thead><tr style="background-color: #f1f5f9; border-bottom: 2px solid #cbd5e1; font-weight: bold;">';
            firstRowCols.forEach(col => {
                html += `<th style="padding: 8px; border: 1px solid #cbd5e1; text-align: left; font-weight: bold; font-size: 13px;">${col}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            // Data rows (skip the separator row if contains ---)
            const startIdx = (rows.length > 1 && rows[1].includes('---')) ? 2 : 1;
            
            for (let i = startIdx; i < rows.length; i++) {
                const cols = rows[i].split('|').map(c => c.trim()).filter((c, idx, arr) => idx > 0 && idx < arr.length - 1);
                html += '<tr style="border-bottom: 1px solid #cbd5e1;">';
                cols.forEach(col => {
                    html += `<td style="padding: 8px; border: 1px solid #cbd5e1; font-size: 13px;">${col}</td>`;
                });
                html += '</tr>';
            }
            
            html += '</tbody></table>';
            return html;
        }

        const agentConfigs = {
            "Macro Analyst": { class: "cyan", initials: "MS", name: "Macro Analyst" },
            "Bullish Value Analyst": { class: "green", initials: "BA", name: "Bullish Analyst" },
            "Bearish Risk Analyst": { class: "red", initials: "RA", name: "Bearish Analyst" },
            "Aggressive Risk Analyst": { class: "yellow", initials: "AR", name: "Aggressive Risk" },
            "Conservative Risk Analyst": { class: "blue", initials: "CR", name: "Conservative Risk" },
            "Impartial Portfolio Manager": { class: "magenta", initials: "PM", name: "Portfolio Manager" },
            "One-Shot Analyst": { class: "cyan", initials: "OS", name: "One-Shot Analyst" }
        };

        const defaultStages = {
            "one_shot": [
                { num: 1, name: "One-Shot Analysis" },
                { num: 2, name: "Decision Upload" }
            ],
            "fast": [
                { num: 1, name: "Macro Environment Analysis" },
                { num: 2, name: "Specialist Research" },
                { num: 3, name: "Final Executive Decision" },
                { num: 4, name: "Decision Upload" }
            ],
            "complete": [
                { num: 1, name: "Macro Environment Analysis" },
                { num: 2, name: "Specialist Research" },
                { num: 3, name: "Senior Risk Debate" },
                { num: 4, name: "Analyst Defense" },
                { num: 5, name: "Q&A Based Proposals" },
                { num: 6, name: "Final Executive Decision" },
                { num: 7, name: "Decision Upload" }
            ]
        };



        async function checkServerStatus() {
            try {
                const res = await fetch('/api/server/status');
                if (res.ok) {
                    const data = await res.json();
                    const isRunning = data.running || data.llamacppRunning || data.summaryServerRunning || data.openrouterRunning;
                    const provider = data.provider || (data.openrouterRunning ? "openrouter" : (data.llamacppRunning ? "llamacpp" : ""));
                    updateServerStatus(isRunning, provider);
                    if (data.costData) {
                        updateCostUI(data.costData);
                    }
                }
            } catch (e) {
                updateServerStatus(false);
            }
        }



        function handleSimulationEvent(payload) {
            const { type, agentRole, agentColor, phase, stageNum } = payload;
            const activeStage = (stageNum !== undefined && stageNum !== null) ? stageNum : currentStageNumber;

            if (type !== "contentToken" && type !== "reasoningToken") {
                console.log("UI Event Received:", payload);
            }

            switch(type) {
                case "metricsUpdate":
                    updateServerStatus(true);
                    if (payload.prefillSpeed !== undefined) {
                        const prefillEl = document.getElementById("prefillSpeedVal");
                        if (prefillEl) prefillEl.innerText = formatTokSpeed(payload.prefillSpeed);
                    }
                    if (payload.genSpeed !== undefined) {
                        const genEl = document.getElementById("genSpeedVal");
                        if (genEl) genEl.innerText = formatTokSpeed(payload.genSpeed);
                    }
                    break;

                case "costUpdate":
                    updateServerStatus(true);
                    updateCostUI(payload);
                    break;

                case "llamaCppStartupLog":
                    appendLlamaLog(payload.log);
                    break;

                case "stageStart":
                    setupStageLayout(payload.stageNum, payload.stageName, payload.agents);
                    break;
                
                case "agentRunStart":
                    getOrCreateAgentPane(activeStage, agentRole, agentColor);
                    break;

                case "reasoningStart":
                    startReasoningBlock(activeStage, agentRole);
                    break;

                case "reasoningToken":
                    appendReasoningToken(activeStage, agentRole, payload.token);
                    break;

                case "reasoningEnd":
                    endCurrentBlock(activeStage, agentRole);
                    break;

                case "contentStart":
                    startContentBlock(activeStage, agentRole, phase);
                    break;

                case "contentToken":
                    appendContentToken(activeStage, agentRole, payload.token, phase);
                    break;

                case "contentEnd":
                    endCurrentBlock(activeStage, agentRole);
                    break;

                case "toolCallStreamStart":
                    startToolCallStream(activeStage, agentRole, payload.index, payload.toolName);
                    break;

                case "toolCallStreamToken":
                    appendToolCallStreamToken(activeStage, agentRole, payload.index, payload.token);
                    break;

                case "toolCallStart":
                    startToolBlock(activeStage, agentRole, payload.toolName, payload.args, payload.callId, payload.toolIndex);
                    break;

                case "toolCallEnd":
                    if (payload.toolName && payload.toolName.startsWith("confirmBoardroomDecision")) {
                        updateUploadReceipt(payload.result, payload.status === "success" ? "UPLOADED" : "FAILED");
                    } else {
                        endToolBlock(activeStage, agentRole, payload.toolName, payload.callId, payload.status, payload.result, payload.stdout, payload.variables, payload.toolIndex);
                    }
                    break;

                case "agentRunEnd":
                    endCurrentBlock(activeStage, agentRole);
                    break;

                case "simComplete":
                    setControlsRunningState(false);
                    
                    if (timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                    stopMetricsPolling();
                    if (payload.totalTime) {
                        const timerEl = document.getElementById("simulationTimer");
                        if (timerEl) {
                            timerEl.innerText = "⏱ " + payload.totalTime;
                        }
                    }
                    
                    // Mark all stages as completed in the stages bar
                    const items = document.querySelectorAll(".stage-item");
                    items.forEach(item => {
                        item.classList.add("completed");
                    });
                    
                    // Show final time taken underneath the decision report
                    const finalTimeRow = document.getElementById("finalTimeReportRow");
                    if (finalTimeRow) {
                        finalTimeRow.style.display = "block";
                        const finalTimeVal = document.getElementById("finalTimeReportValue");
                        if (finalTimeVal) {
                            finalTimeVal.innerText = "Time Taken: " + (payload.totalTime || "");
                        }
                    }
                    break;

                case "simStopped":
                    setControlsRunningState(false);
                    if (timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                    stopMetricsPolling();
                    break;

                case "error":
                    alert("Simulation Error: " + payload.message);
                    setControlsRunningState(false);
                    if (timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                    stopMetricsPolling();
                    break;
            }
        }

        function appendLlamaLog(logLine) {
            const container = document.getElementById("llamaLoadingContainer");
            const logsPre = document.getElementById("llamaLoadingLogs");
            if (container.style.display !== "flex") {
                container.style.display = "flex";
            }
            logsPre.textContent += logLine + "\n";
            container.scrollTop = container.scrollHeight;
        }

        function updateUploadReceipt(dataString, status) {
            let data = {};
            try {
                if (typeof dataString === "string") {
                    data = JSON.parse(dataString);
                } else {
                    data = dataString;
                }
            } catch (e) {
                console.error("Failed to parse tool arguments for receipt", e);
            }

            const tickerVal = data.ticker || "--";
            const ratingVal = data.rating || "--";
            const weightingVal = data.weighting || "--";

            let label1 = "12-Month Price Target:";
            let label2 = "3-Year Price Target:";
            let val1 = "--";
            let val2 = "--";
            let months1 = "12";
            let months2 = "36";

            if (data.oneMonthTarget !== undefined && data.threeMonthTarget !== undefined) {
                label1 = "1-Month Price Target:";
                val1 = data.oneMonthTarget;
                months1 = "1";
                label2 = "3-Month Price Target:";
                val2 = data.threeMonthTarget;
                months2 = "3";
            } else if (data.threeMonthTarget !== undefined && data.twelveMonthTarget !== undefined) {
                label1 = "3-Month Price Target:";
                val1 = data.threeMonthTarget;
                months1 = "3";
                label2 = "12-Month Price Target:";
                val2 = data.twelveMonthTarget;
                months2 = "12";
            } else if (data.twelveMonthTarget !== undefined && data.threeYearTarget !== undefined) {
                label1 = "12-Month Price Target:";
                val1 = data.twelveMonthTarget;
                months1 = "12";
                label2 = "3-Year Price Target:";
                val2 = data.threeYearTarget;
                months2 = "36";
            } else if (data.threeYearTarget !== undefined && data.tenYearTarget !== undefined) {
                label1 = "3-Year Price Target:";
                val1 = data.threeYearTarget;
                months1 = "36";
                label2 = "10-Year Price Target:";
                val2 = data.tenYearTarget;
                months2 = "120";
            } else {
                val1 = data.twelveMonthTarget || "--";
                val2 = data.threeYearTarget || "--";
            }

            if (val1 !== "--" && !String(val1).startsWith("$")) {
                val1 = `$${val1}`;
            }
            if (val2 !== "--" && !String(val2).startsWith("$")) {
                val2 = `$${val2}`;
            }

            const tickerEl = document.getElementById("receipt-ticker");
            const dateEl = document.getElementById("receipt-date");
            const ratingEl = document.getElementById("receipt-rating");
            const weightingEl = document.getElementById("receipt-weighting");
            const label1El = document.getElementById("receipt-label-1");
            const label2El = document.getElementById("receipt-label-2");
            const target12El = document.getElementById("receipt-target-12");
            const target36El = document.getElementById("receipt-target-36");
            const statusEl = document.getElementById("receipt-status");

            if (tickerEl) tickerEl.innerText = tickerVal;
            if (dateEl) dateEl.innerText = formatOrdinalDate(currentSimulatedDate);
            
            if (ratingEl) {
                ratingEl.innerText = ratingVal;
                ratingEl.className = "tool-status-badge";
                if (ratingVal === "BUY" || ratingVal === "OVERWEIGHT" || ratingVal === "STRONG BUY") {
                    ratingEl.classList.add("status-success");
                } else if (ratingVal === "SELL" || ratingVal === "UNDERWEIGHT" || ratingVal === "STRONG SELL") {
                    ratingEl.classList.add("status-error");
                } else {
                    ratingEl.classList.add("status-running");
                }
            }

            if (weightingEl) weightingEl.innerText = weightingVal;
            if (label1El) label1El.innerText = label1;
            if (label2El) label2El.innerText = label2;
            if (target12El) {
                target12El.innerText = val1;
                target12El.dataset.months = months1;
            }
            if (target36El) {
                target36El.innerText = val2;
                target36El.dataset.months = months2;
            }

            if (tickerVal !== "--") {
                currentTicker = tickerVal;
            }

            if (statusEl) {
                statusEl.innerText = status;
                statusEl.className = "tool-status-badge";
                if (status === "UPLOADED" || status === "SUCCESS") {
                    statusEl.classList.add("status-success");
                } else if (status === "FAILED") {
                    statusEl.classList.add("status-error");
                } else {
                    statusEl.classList.add("status-running");
                }
            }

            renderStageChart();
        }

        let stageChartInstance = null;

        const simDateLinePlugin = {
            id: 'simDateLine',
            afterDraw: (chart) => {
                const simDate = chart.config.options.simDate;
                if (!simDate) return;
                const xAxis = chart.scales.x;
                const yAxis = chart.scales.y;
                if (!xAxis || !yAxis) return;
                const simTime = (typeof simDate === 'string' && simDate.length === 10) ? new Date(simDate + 'T00:00:00').getTime() : simDate;
                const xPixel = xAxis.getPixelForValue(simTime);
                if (xPixel !== undefined && xPixel >= xAxis.left && xPixel <= xAxis.right) {
                    const ctx = chart.ctx;
                    ctx.save();
                    ctx.beginPath();
                    ctx.setLineDash([4, 4]);
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 1.5;
                    ctx.moveTo(xPixel, yAxis.top);
                    ctx.lineTo(xPixel, yAxis.bottom);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        };

        function createOrUpdateChart(chartData) {
            const canvas = document.getElementById("receiptChartCanvas");
            if (!canvas) return;

            if (stageChartInstance) {
                stageChartInstance.destroy();
                stageChartInstance = null;
            }

            const datasets = [];

            if (chartData.historical && chartData.historical.length > 0) {
                datasets.push({
                    label: 'Historical',
                    data: chartData.historical,
                    borderColor: '#2563eb',
                    borderWidth: 1.8,
                    backgroundColor: 'rgba(37, 99, 235, 0.08)',
                    fill: 'start',
                    tension: 0.1,
                    pointRadius: 0,
                    pointHoverRadius: 3
                });
            }

            if (chartData.futureChunks && chartData.futureChunks.length > 0) {
                chartData.futureChunks.forEach(chunk => {
                    const color = chunk.color || '#f43f5e';
                    const isGreen = color === '#10b981';
                    const bg = isGreen ? 'rgba(16, 185, 129, 0.08)' : 'rgba(244, 63, 94, 0.08)';
                    datasets.push({
                        label: isGreen ? 'Outperforming' : 'Underperforming',
                        data: chunk.points,
                        borderColor: color,
                        borderWidth: 1.8,
                        backgroundColor: bg,
                        fill: 'start',
                        tension: 0.1,
                        pointRadius: 0,
                        pointHoverRadius: 3
                    });
                });
            }

            if (chartData.targetCurve && chartData.targetCurve.length > 0) {
                datasets.push({
                    label: 'Prediction Curve',
                    data: chartData.targetCurve,
                    borderColor: '#06b6d4',
                    borderWidth: 2.8,
                    fill: false,
                    tension: 0,
                    pointRadius: 0,
                    pointHoverRadius: 0
                });
            }

            if (chartData.targetPoints && chartData.targetPoints.length > 0) {
                datasets.push({
                    label: 'Target Points',
                    data: chartData.targetPoints,
                    borderColor: '#ffffff',
                    borderWidth: 1.5,
                    backgroundColor: '#06b6d4',
                    pointRadius: 6,
                    pointHoverRadius: 8,
                    showLine: false
                });
            }

            if (chartData.simAnchor) {
                datasets.push({
                    label: 'Analysis Date',
                    data: [chartData.simAnchor],
                    borderColor: '#ffffff',
                    borderWidth: 1,
                    backgroundColor: '#64748b',
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    showLine: false
                });
            }

            Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

            const ctx = canvas.getContext('2d');
            stageChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: datasets
                },
                plugins: [simDateLinePlugin],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    simDate: chartData.simDate,
                    interaction: {
                        mode: 'nearest',
                        intersect: false
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const val = context.parsed.y;
                                    return `${context.dataset.label}: $${val.toFixed(2)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                tooltipFormat: 'yyyy-MM-dd',
                                displayFormats: {
                                    month: "MMM 'yy",
                                    day: "MMM 'yy"
                                }
                            },
                            min: chartData.startDate ? new Date(chartData.startDate + 'T00:00:00').getTime() : undefined,
                            max: chartData.endDate ? new Date(chartData.endDate + 'T00:00:00').getTime() : undefined,
                            grid: {
                                color: '#cbd5e1',
                                borderDash: [2, 2],
                                tickColor: 'transparent'
                            },
                            ticks: {
                                color: '#334155',
                                font: {
                                    family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
                                    weight: '700',
                                    size: 10
                                },
                                maxTicksLimit: 7
                            },
                            border: {
                                color: '#334155',
                                width: 1.2
                            }
                        },
                        y: {
                            suggestedMin: chartData.yMin,
                            suggestedMax: chartData.yMax,
                            grid: {

        async function renderStageChart() {
            const canvas = document.getElementById("receiptChartCanvas");
            if (!canvas) return;

            const ticker = currentTicker || (document.getElementById("tickerInput") ? document.getElementById("tickerInput").value.trim().toUpperCase() : "NVDA");
            
            let simDateStr = currentSimulatedDate;
            if (!simDateStr) {
                const simCheckbox = document.getElementById("simulatedDateCheckbox");
                if (simCheckbox && simCheckbox.checked) {
                    simDateStr = document.getElementById("simulatedDateInput").value;
                }
            }
            if (!simDateStr) {
                simDateStr = new Date().toISOString().split("T")[0];
            }

            const t12El = document.getElementById("receipt-target-12");
            const t36El = document.getElementById("receipt-target-36");
            
            const targets = [];
            if (t12El && t12El.innerText && t12El.innerText !== "--") {
                const val = t12El.innerText.trim().replace("$", "");
                const m = t12El.dataset.months || "12";
                if (val) targets.push(`${m}:${val}`);
            }
            if (t36El && t36El.innerText && t36El.innerText !== "--") {
                const val = t36El.innerText.trim().replace("$", "");
                const m = t36El.dataset.months || "36";
                if (val) targets.push(`${m}:${val}`);
            }

            const horizon = document.getElementById("horizonSelect") ? document.getElementById("horizonSelect").value : "long";
            try {
                let url = `/api/ohlcv?ticker=${encodeURIComponent(ticker)}&simDate=${encodeURIComponent(simDateStr)}&horizon=${encodeURIComponent(horizon)}`;
                if (targets.length > 0) {
                    url += `&targets=${encodeURIComponent(targets.join(","))}`;
                }
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    createOrUpdateChart(data);
                }
            } catch (e) {
                console.error("Failed to fetch OHLCV chart data:", e);
            }
        }

        // Helper to try pretty formatting a JSON string (with indents)
        function tryFormatJson(str) {
            try {
                const trimmed = String(str).trim();
                if ((trimmed.startsWith("{") && trimmed.endsWith("}")) || 
                    (trimmed.startsWith("[") && trimmed.endsWith("]"))) {
                    const parsed = JSON.parse(trimmed);
                    return JSON.stringify(parsed, null, 2);
                }
            } catch (e) {}
            return str;
        }

        // Regex to extract value of "code" property from partial JSON string
        function extractPartialCode(rawJson) {
            const match = rawJson.match(/"code"\s*:\s*"((?:[^"\\]|\\.)*)/);
            if (match) {
                // Unescape basic characters (\n, \", \\)
                return match[1].replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
            }
            return rawJson;
        }

                    }

                // Update pre element
                const pre = toolBlock.querySelector(".tool-stream-pre");
                if (pre) {

                    resDiv.style.marginTop = "10px";
                    resDiv.innerHTML = `<div style="font-weight: bold; font-size: 12px; color: #475569; margin-bottom: 4px;">Result:</div>
                                         <pre style="margin: 0; background-color: #f8fafc; border: 1.5px solid #e2e8f0; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 12px; white-space: pre-wrap; color: #0f172a;">${prettyResult}</pre>`;
                    content.appendChild(resDiv);

                    // Format and show stdout if present
                    if (stdout && stdout.trim()) {
                        const trimmedStdout = String(stdout).trim();
                        const stdoutDiv = document.createElement("div");
                        stdoutDiv.style.marginTop = "10px";
                        stdoutDiv.innerHTML = `<div style="font-weight: bold; font-size: 12px; color: #475569; margin-bottom: 4px;">STDOUT:</div>
                                               <pre style="margin: 0; background-color: #0f172a; color: #38bdf8; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; overflow-x: auto; white-space: pre-wrap;">${trimmedStdout}</pre>`;
                        content.appendChild(stdoutDiv);
                    }

                    // Format and show variables if present
                    if (variables && Object.keys(variables).length > 0) {
                        const varDiv = document.createElement("div");
                        varDiv.style.marginTop = "10px";
                        let varRows = "";
                        for (const [k, v] of Object.entries(variables)) {
                            const prettyVal = tryFormatJson(v);
                            varRows += `<tr><td style="padding: 4px 8px; font-weight: bold; font-family: monospace; border: 1px solid #cbd5e1; vertical-align: top;">${k}</td><td style="padding: 4px 8px; font-family: monospace; border: 1px solid #cbd5e1; vertical-align: top; white-space: pre-wrap;">${prettyVal}</td></tr>`;
                        }
                        varDiv.innerHTML = `<div style="font-weight: bold; font-size: 12px; color: #475569; margin-bottom: 4px;">Variables:</div>
                                             <table style="border-collapse: collapse; width: 100%; border: 1px solid #cbd5e1; font-size: 12px; background-color: #ffffff;">${varRows}</table>`;
                        content.appendChild(varDiv);
                    }
                }

                // Collapse the tool call block automatically after it finishes running
                toolBlock.classList.add("collapsed");

                // Clean up the streaming arguments dictionary
                const key = `${stageNum}_${toolIndex}`;
                delete streamingArgs[key];

                const compoundKey = `${stageNum}_${agentRole}`;
                if (activeAgentPanes[compoundKey]) {
                    const feed = activeAgentPanes[compoundKey].feed;
                    feed.scrollTop = feed.scrollHeight;
                }
            }
        }

        function endCurrentBlock(stageNum, agentRole) {
            const compoundKey = `${stageNum}_${agentRole}`;
            const active = activeBlocks[compoundKey];
            if (active) {
                if (active.type === 'thinking' && active.block) {
                    active.block.classList.add("collapsed");
                }
                delete activeBlocks[compoundKey];
            }
        }

        function setControlsRunningState(isRunning) {
            document.getElementById("tickerInput").disabled = isRunning;
            document.getElementById("modeSelect").disabled = isRunning;
            document.getElementById("simulatedDateCheckbox").disabled = isRunning;
            document.getElementById("simulatedDateInput").disabled = isRunning;
            document.getElementById("runBtn").disabled = isRunning;
            
            const stopBtn = document.getElementById("stopBtn");
            if (stopBtn) {
                stopBtn.style.display = isRunning ? "inline-block" : "none";
                stopBtn.disabled = false;
            }
        }

        function stopSimulation() {
            const stopBtn = document.getElementById("stopBtn");
            if (stopBtn) {
                stopBtn.disabled = true;
            }
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ action: "stop" }));
            }
        }

        function startSimulation() {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert("WebSocket is not connected. Trying to connect...");
                connectWebsocket();
                return;
            }

            if (!serverIsLoaded) {
                alert("Server not connect. Please load and connect to a server first.");
                return;
            }

            const ticker = document.getElementById("tickerInput").value.trim().toUpperCase();
            const mode = document.getElementById("modeSelect").value;
            const useSimDate = document.getElementById("simulatedDateCheckbox").checked;
            let simulatedDate = null;
            if (useSimDate) {
                simulatedDate = document.getElementById("simulatedDateInput").value || null;
                if (!simulatedDate) {
                    alert("Please select a valid simulation date.");
                    return;
                }
                const today = new Date().toISOString().split('T')[0];
                if (simulatedDate > today) {
                    alert("Simulation date cannot be in the future.");
                    return;
                }
            }
            currentTicker = ticker;
            currentSimulatedDate = simulatedDate || new Date().toISOString().split('T')[0];

            if (!ticker) {
                alert("Please enter a valid ticker.");
                return;
            }

            setControlsRunningState(true);
            document.getElementById("panesContainer").innerHTML = "";

            initStagesBar(mode);

            if (timerInterval) {
                clearInterval(timerInterval);
            }
            const timerEl = document.getElementById("simulationTimer");
            if (timerEl) {
                timerEl.style.display = "inline-block";
                timerEl.innerText = "0 mins 0.00 secs";
            }
            const startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsedMs = Date.now() - startTime;
                const elapsedSec = elapsedMs / 1000;
                const mins = Math.floor(elapsedSec / 60);
                const secs = elapsedSec % 60;
                if (timerEl) {
                    timerEl.innerText = `${mins} mins ${secs.toFixed(2)} secs`;
                }
            }, 10);
            const sidebarContent = document.getElementById("sidebarContent");
            if (sidebarContent) {
                sidebarContent.innerHTML = "";
            }
            activeAgentPanes = {};
            activeBlocks = {};
            currentStageNumber = 0;
            highestStageNumber = 0;

            const horizon = document.getElementById("horizonSelect").value;

            socket.send(JSON.stringify({
                action: "start",
                ticker,
                mode,
                boardroomPace: mode,
                timeHorizon: horizon,
                useSimDate: useSimDate,
                simulatedDate: simulatedDate
            }));
        }

        document.getElementById("modeSelect").onchange = (e) => {
            initStagesBar(e.target.value);
        };

        // Toggle simulated date container visibility based on checkbox
        document.getElementById("simulatedDateCheckbox").addEventListener("change", function() {
            const container = document.getElementById("simulatedDateContainer");
            if (this.checked) {
                container.style.display = "flex";
            } else {
                container.style.display = "none";
            }
        });

        initStagesBar(document.getElementById("modeSelect").value || "fast");
        connectWebsocket();
        checkServerStatus();
    </script>
</body>
</html>
