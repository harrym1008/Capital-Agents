<header>
    
    <a href="/" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
        <img src="/static/favicon.png" alt="CapitalAgents Logo" style="width: 32px; height: 32px; margin-right: 12px;">
    </a>

    <h1 style="margin-bottom: 4px;">
        <a href="/" style="color: inherit; text-decoration: none;">CapitalAgents</a>
    </h1>
    
    <div style="margin-left: auto; display: flex; align-items: center; gap: 24px;">
        <div id="connectionStatusReadout" style="display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; line-height: 1.25; font-weight: 700; color: #ffffff; user-select: none;">
            <div style="display: flex; gap: 12px; justify-content: space-between; width: 100%;">
                <span style="color: #cbd5e1; font-weight: 600; flex: 1; text-align: right;">WebSocket:</span>
                <span id="wsStatusCell" style="min-width: 95px; text-align: left; color: #ef4444;">Disconnected</span>
            </div>
            <div style="display: flex; gap: 12px; justify-content: space-between; width: 100%;">
                <a href="/server-config" style="text-decoration: none; display: contents;">
                    <span id="serverStatusLabel" style="color: #cbd5e1; font-weight: 600; flex: 1; text-align: right; cursor: pointer;">Server:</span>
                </a>
                <span id="serverStatusCell" style="min-width: 95px; text-align: left; color: #ef4444;">Disconnected</span>
            </div>
        </div>

        <div id="tokenMetricsReadout" style="display: none; flex-direction: column; align-items: flex-end; font-size: 13px; line-height: 1.25; font-weight: 700; color: #ffffff;">
            <div id="prefillMetricRow" style="display: flex; gap: 12px; justify-content: space-between;">
                <span style="color: #cbd5e1; font-weight: 600;">Prefill:</span>
                <span id="prefillSpeedVal" style="min-width: 80px; text-align: right;">0.0 tok/s</span>
            </div>
            <div id="genMetricRow" style="display: flex; gap: 12px; justify-content: space-between;">
                <span style="color: #cbd5e1; font-weight: 600;">Generate:</span>
                <span id="genSpeedVal" style="min-width: 80px; text-align: right;">0.0 tok/s</span>
            </div>
        </div>

        <div id="costMetricsReadout" style="display: none; grid-template-columns: auto auto auto auto auto; gap: 4px 12px; align-items: center; font-size: 13px; line-height: 1.25; font-weight: 700; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; user-select: none;">
            <!-- Task Row -->
            <span style="color: #cbd5e1; font-weight: 600; text-align: right;">Task:</span>
            <span style="display: flex; align-items: center; gap: 4px; color: #e2e8f0;" title="Input Tokens">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                <span id="taskInputToksVal">0</span>
            </span>
            <span style="display: flex; align-items: center; gap: 4px; color: #e2e8f0;" title="Output Tokens">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                <span id="taskOutputToksVal">0</span>
            </span>
            <span style="display: flex; align-items: center; gap: 4px; color: #e2e8f0;" title="Cache Hit Rate">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                <span id="taskCacheHitVal">0.0%</span>
            </span>
            <span id="taskCostVal" style="text-align: right; min-width: 60px;" title="Task Cost">$0.0000</span>

            <!-- Session Row -->
            <span style="color: #cbd5e1; font-weight: 600; text-align: right;">Session:</span>
            <span style="display: flex; align-items: center; gap: 4px; color: #e2e8f0;" title="Input Tokens">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                <span id="sessionInputToksVal">0</span>
            </span>
            <span style="display: flex; align-items: center; gap: 4px; color: #e2e8f0;" title="Output Tokens">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                <span id="sessionOutputToksVal">0</span>
            </span>
            <span style="display: flex; align-items: center; gap: 4px; color: #e2e8f0;" title="Cache Hit Rate">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                <span id="sessionCacheHitVal">0.0%</span>
            </span>
            <span id="sessionCostVal" style="text-align: right; min-width: 60px;" title="Session Cost">$0.0000</span>
        </div>

    </div>
</header>
<script>
    let activeProviderName = "";

    function updateWsStatus(isConnected) {
        const cell = document.getElementById("wsStatusCell");
        if (cell) {
            cell.textContent = isConnected ? "Connected" : "Disconnected";
            cell.style.color = isConnected ? "#22c55e" : "#ef4444";
            if (!isConnected) {
                updateServerStatus(false);
            }
        }
    }

    function updateServerStatus(isConnected, provider = "") {
        if (typeof serverIsLoaded !== 'undefined') {
            serverIsLoaded = isConnected;
        }
        if (typeof setServerConnectedState === 'function') {
            setServerConnectedState(isConnected);
        }
        if (provider) activeProviderName = provider;
        const cell = document.getElementById("serverStatusCell");
        const label = document.getElementById("serverStatusLabel");
        const tokEl = document.getElementById("tokenMetricsReadout");
        const costEl = document.getElementById("costMetricsReadout");

        if (cell) {
            cell.textContent = isConnected ? "Connected" : "Disconnected";
            cell.style.color = isConnected ? "#22c55e" : "#ef4444";
        }
        const p = (provider || activeProviderName).toLowerCase();
        if (label) {
            if (p === "openrouter") {
                label.textContent = "OpenRouter:";
            } else if (p === "llamacpp") {
                label.textContent = "Llama.cpp:";
            } else if (p === "openaicompatible") {
                label.textContent = "OpenAI Compatible:";
            } else {
                label.textContent = "Server:";
            }
        }

        if (isConnected) {
            if (p === "llamacpp") {
                if (tokEl) tokEl.style.display = "flex";
                if (costEl) costEl.style.display = "none";
            } else if (p === "openrouter") {
                if (tokEl) tokEl.style.display = "none";
                if (costEl) costEl.style.display = "grid";
            } else {
                if (tokEl) tokEl.style.display = "none";
                if (costEl) costEl.style.display = "none";
            }
        } else {
            if (tokEl) tokEl.style.display = "none";
            if (costEl) costEl.style.display = "none";
        }
    }

    let socket = null;
    const wsSubscribers = new Set();

    window.wsSubscribe = function(callback) {
        if (typeof callback === 'function') {
            wsSubscribers.add(callback);
            return () => wsSubscribers.delete(callback);
        }
    };

    window.sendWsMessage = function(data) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
            connectWebsocket();
            // Give socket brief moment to connect if it was opening
            if (socket && socket.readyState === WebSocket.CONNECTING) {
                const payloadStr = typeof data === 'string' ? data : JSON.stringify(data);
                const prevOnOpen = socket.onopen;
                socket.onopen = (evt) => {
                    if (prevOnOpen) prevOnOpen(evt);
                    socket.send(payloadStr);
                };
                return true;
            }
        }
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(typeof data === 'string' ? data : JSON.stringify(data));
            return true;
        }
        return false;
    };

    function formatTokSpeed(val) {
        if (val === undefined || val === null || isNaN(val) || val <= 0) return "0.0 tok/s";
        if (val < 1000) {
            return val.toFixed(1) + " tok/s";
        } else {
            return Math.round(val).toString() + " tok/s";
        }
    }

    function connectWebsocket() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
            return;
        }
        const wsUrl = `ws://${window.location.hostname}:9092`;
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            updateWsStatus(true);
        };

        socket.onclose = () => {
            updateWsStatus(false);
            if (typeof setControlsRunningState === 'function') {
                setControlsRunningState(false);
            }
        };

        socket.onerror = () => {
            updateWsStatus(false);
        };

        socket.onmessage = (event) => {
            try {
                const payload = JSON.parse(event.data);

                // Automatically update header token speeds and cost metrics from WS push events
                if (payload.type === "metricsUpdate") {
                    updateServerStatus(true);
                    if (payload.prefillSpeed !== undefined) {
                        const prefillEl = document.getElementById("prefillSpeedVal");
                        if (prefillEl) prefillEl.innerText = formatTokSpeed(payload.prefillSpeed);
                    }
                    if (payload.genSpeed !== undefined) {
                        const genEl = document.getElementById("genSpeedVal");
                        if (genEl) genEl.innerText = formatTokSpeed(payload.genSpeed);
                    }
                } else if (payload.type === "costUpdate") {
                    updateServerStatus(true);
                    updateCostUI(payload);
                }

                // Notify all registered subscribers
                wsSubscribers.forEach(callback => {
                    try { callback(payload); } catch(err) { console.error("Error in WS subscriber:", err); }
                });

                // Delegate to page-specific handler if defined
                if (typeof handleSimulationEvent === 'function') {
                    handleSimulationEvent(payload);
                }
            } catch (e) {
                console.error("Error parsing WS message:", e);
            }
        };
    }

    function formatTokenCount(val) {
        if (val === undefined || val === null || isNaN(val) || val <= 0) return "0";
        const num = Math.abs(parseFloat(val));
        if (num >= 1e9) return Number((num / 1e9).toPrecision(3)) + "b";
        if (num >= 1e6) return Number((num / 1e6).toPrecision(3)) + "m";
        if (num >= 1e3) return Number((num / 1e3).toPrecision(3)) + "k";
        return Number(num.toPrecision(3)).toString();
    }

    function formatCacheHitRate(val) {
        if (val === undefined || val === null || isNaN(val)) return "0.0%";
        return parseFloat(val).toFixed(1) + "%";
    }

    function formatCost(val) {
        if (val === undefined || val === null || isNaN(val)) return "$0.0000";
        const num = parseFloat(val);
        if (num < 10) return "$" + num.toFixed(4);
        return "$" + num.toFixed(2);
    }

    function updateCostUI(payload) {
        if (!payload) return;
        if (payload.task) {
            if (payload.task.input !== undefined) {
                const el = document.getElementById("taskInputToksVal");
                if (el) el.innerText = formatTokenCount(payload.task.input);
            }
            if (payload.task.output !== undefined) {
                const el = document.getElementById("taskOutputToksVal");
                if (el) el.innerText = formatTokenCount(payload.task.output);
            }
            if (payload.task.cacheHitRate !== undefined) {
                const el = document.getElementById("taskCacheHitVal");
                if (el) el.innerText = formatCacheHitRate(payload.task.cacheHitRate);
            }
            if (payload.task.cost !== undefined) {
                const el = document.getElementById("taskCostVal");
                if (el) el.innerText = formatCost(payload.task.cost);
            }
        }
        if (payload.session) {
            if (payload.session.input !== undefined) {
                const el = document.getElementById("sessionInputToksVal");
                if (el) el.innerText = formatTokenCount(payload.session.input);
            }
            if (payload.session.output !== undefined) {
                const el = document.getElementById("sessionOutputToksVal");
                if (el) el.innerText = formatTokenCount(payload.session.output);
            }
            if (payload.session.cacheHitRate !== undefined) {
                const el = document.getElementById("sessionCacheHitVal");
                if (el) el.innerText = formatCacheHitRate(payload.session.cacheHitRate);
            }
            if (payload.session.cost !== undefined) {
                const el = document.getElementById("sessionCostVal");
                if (el) el.innerText = formatCost(payload.session.cost);
            }
        }
    }
</script>
