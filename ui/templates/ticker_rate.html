{% extends "boardroom_base.html" %}

{% block title %}CapitalAgents - Single Ticker Rating{% endblock %}

{% block config_inputs %}
    <div class="config-group">
        <label for="tickerInput">Ticker:</label>
        <input type="text" id="tickerInput" placeholder="TCKR" style="width: 80px; text-transform: uppercase;">
    </div>
    <div class="config-group">
        <label for="modeSelect">Mode:</label>
        <select id="modeSelect">
            <option value="one_shot">One-Shot Evaluation</option>
            <option value="fast" selected>Fast Evaluation</option>
            <option value="complete">Complete Evaluation</option>
        </select>
    </div>
    <div class="config-group">
        <label for="horizonSelect">Horizon:</label>
        <select id="horizonSelect">
            <option value="immediate">Immediate (3d & 2wk)</option>
            <option value="short">Short (1mo & 3mo)</option>
            <option value="medium">Medium (3mo & 12mo)</option>
            <option value="long" selected>Long (12mo & 3y)</option>
            <option value="distant">Distant (3y & 10y)</option>
        </select>
    </div>
    <div class="config-group">
        <label for="simulatedDateCheckbox">Use Sim Date:</label>
        <input type="checkbox" id="simulatedDateCheckbox">
    </div>
    <div class="config-group" id="simulatedDateContainer" style="display: none;">
        <input type="date" id="simulatedDateInput" min="2016-01-01" max="" style="width: 150px;">
        <script>
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const formattedDate = yesterday.toISOString().split('T')[0];
            document.getElementById("simulatedDateInput").setAttribute("max", formattedDate);
        </script>
    </div>
{% endblock %}

{% block page_scripts %}
<script>
    let currentTicker = "NVDA";
    let currentSimulatedDate = null;
    let stageChartInstance = null;
    let qaTurnCounter = 0;

    const singleEquityStages = {
        "one_shot": [
            { num: 1, name: "One-Shot Analysis" },
            { num: 2, name: "Decision Upload" }
        ],
        "fast": [
            { num: 1, name: "Macro Environment Analysis" },
            { num: 2, name: "Specialist Research" },
            { num: 3, name: "Final Executive Decision" },
            { num: 4, name: "Decision Upload" }
        ],
        "complete": [
            { num: 1, name: "Macro Environment Analysis" },
            { num: 2, name: "Specialist Research" },
            { num: 3, name: "Senior Risk Debate" },
            { num: 4, name: "Analyst Defense" },
            { num: 5, name: "Q&A Based Proposals" },
            { num: 6, name: "Final Executive Decision" },
            { num: 7, name: "Decision Upload" }
        ]
    };

    // Toggle Simulated Date input
    document.getElementById("simulatedDateCheckbox")?.addEventListener("change", function () {
        const container = document.getElementById("simulatedDateContainer");
        if (container) {
            container.style.display = this.checked ? "flex" : "none";
        }
    });

    function updateQaTargetAgents() {
        const targetSelect = document.getElementById("qaTargetSelect");
        if (!targetSelect) return;

        const mode = document.getElementById("modeSelect")?.value || "fast";
        const currentValue = targetSelect.value;

        let specialists = [];
        if (mode === "one_shot") {
            specialists = [
                { role: "One-Shot Analyst", label: "Ask One-Shot Analyst" }
            ];
        } else if (mode === "fast") {
            specialists = [
                { role: "Macro Analyst", label: "Ask Macro Analyst" },
                { role: "Bullish Value Analyst", label: "Ask Bullish Value Analyst" },
                { role: "Bearish Risk Analyst", label: "Ask Bearish Risk Analyst" },
                { role: "Impartial Portfolio Manager", label: "Ask Impartial Portfolio Manager" }
            ];
        } else {
            specialists = [
                { role: "Macro Analyst", label: "Ask Macro Analyst" },
                { role: "Bullish Value Analyst", label: "Ask Bullish Value Analyst" },
                { role: "Bearish Risk Analyst", label: "Ask Bearish Risk Analyst" },
                { role: "Aggressive Risk Analyst", label: "Ask Aggressive Risk Analyst" },
                { role: "Conservative Risk Analyst", label: "Ask Conservative Risk Analyst" },
                { role: "Impartial Portfolio Manager", label: "Ask Impartial Portfolio Manager" }
            ];
        }

        let optionsHtml = '<option value="auto">Auto Delegate</option>';
        for (const s of specialists) {
            optionsHtml += `<option value="${s.role}">${s.label}</option>`;
        }
        targetSelect.innerHTML = optionsHtml;

        // Restore previous selection if valid for new mode
        if (currentValue && targetSelect.querySelector(`option[value="${currentValue}"]`)) {
            targetSelect.value = currentValue;
        } else {
            targetSelect.value = "auto";
        }
    }

    // Re-init stages bar and target agents when evaluation mode changes
    document.getElementById("modeSelect")?.addEventListener("change", function () {
        BoardroomCore.initStagesBar(this.value, singleEquityStages);
        updateQaTargetAgents();
    });

    // Hook to append Q&A Tab into Stages Bar
    BoardroomCore.on("stagesBarInit", ({ bar }) => {
        if (!bar) return;
        const qaTab = document.createElement("div");
        qaTab.className = "stage-item disabled";
        qaTab.id = "stageStep-qa";
        qaTab.innerText = "Q&A";
        qaTab.style.display = "none";
        qaTab.onclick = () => {
            if (!qaTab.classList.contains("disabled")) {
                BoardroomCore.showStageWorkspace("qa");
            }
        };
        bar.appendChild(qaTab);

        // Pre-build the Q&A workspace if not already present
        const panesContainer = document.getElementById("panesContainer");
        if (panesContainer && !document.getElementById("stageWorkspace-qa")) {
            const qaWorkspace = document.createElement("div");
            qaWorkspace.className = "stage-workspace";
            qaWorkspace.id = "stageWorkspace-qa";
            qaWorkspace.style.display = "none";
            qaWorkspace.style.flex = "1";
            qaWorkspace.style.minHeight = "0";
            qaWorkspace.style.height = "100%";
            qaWorkspace.style.flexDirection = "column";

            qaWorkspace.innerHTML = `
                <div id="qaChatHistory" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 1000px; margin: 0 auto; overflow-y: auto; padding-right: 10px;">
                    <div class="agent-pane qa-agent-pane qa-welcome-pane">
                        <div class="agent-header">
                            <div class="agent-avatar agent-cyan">SP</div>
                            <div class="agent-role-name">Boardroom Spokesperson</div>
                        </div>
                        <div class="agent-feed" style="font-size: 15px; overflow-y: visible; line-height: 1.6; color: #1e293b;">
                            Welcome to the Boardroom Q&A. You can ask any question regarding the evaluation, financial models, valuation metrics, or risk assessment, and I will summarise directly or transfer you to the relevant specialist analyst.
                        </div>
                    </div>
                </div>

                <div style="flex: none; width: 100%; max-width: 1000px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; padding-right: 10px; padding-top: 10px;">
                    <textarea id="qaInput" rows="1" placeholder="Ask a question... (Enter to send, Shift+Enter for newline)" style="flex: 1; padding: 12px 16px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; background: #ffffff; color: #0f172a; resize: none; overflow-y: hidden; min-height: 48px; max-height: 220px; box-sizing: border-box; line-height: 1.5; font-family: inherit;"></textarea>
                    <select id="qaTargetSelect" style="flex: none; height: 48px; padding: 0 14px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-weight: 600; outline: none; background: #ffffff; color: #1e293b; cursor: pointer; box-sizing: border-box;">
                        <option value="auto">Auto Delegate</option>
                    </select>
                    <button id="qaSendBtn" class="run-btn" style="flex: none; height: 48px; padding: 0 24px; border-radius: 8px; font-weight: bold; font-size: 16px; box-sizing: border-box;">Send</button>
                </div>
            `;
            panesContainer.appendChild(qaWorkspace);

            setTimeout(() => {
                const qaChatHistory = document.getElementById("qaChatHistory");
                if (qaChatHistory) BoardroomCore.setupAutoScroll(qaChatHistory);

                const qaInput = document.getElementById("qaInput");
                const targetSelect = document.getElementById("qaTargetSelect");
                const sendBtn = document.getElementById("qaSendBtn");

                // Populate target specialist options based on current evaluation mode
                updateQaTargetAgents();

                if (qaInput) {
                    const adjustTextareaHeight = () => {
                        qaInput.style.height = "auto";
                        const newHeight = Math.min(qaInput.scrollHeight, 220);
                        qaInput.style.height = newHeight + "px";
                        if (qaInput.scrollHeight > 220) {
                            qaInput.style.overflowY = "auto";
                        } else {
                            qaInput.style.overflowY = "hidden";
                        }
                    };

                    qaInput.addEventListener("input", adjustTextareaHeight);

                    const sendMsg = () => {
                        const val = qaInput.value.trim();
                        if (val) {
                            if (typeof window.sendWsMessage !== "function" || !window.sendWsMessage({ action: "status" })) {
                                alert("WebSocket is not connected. Trying to connect...");
                                if (typeof connectWebsocket === "function") connectWebsocket();
                                return;
                            }

                            const chatLog = document.getElementById("qaChatHistory");
                            const turnIndex = qaTurnCounter++;
                            const chosenTarget = targetSelect ? targetSelect.value : "auto";

                            const userMsg = document.createElement("div");
                            userMsg.className = "agent-pane qa-user-pane";
                            userMsg.setAttribute("data-turn-index", turnIndex);
                            userMsg.style.cssText = "flex: none; height: auto; background-color: #3949bb; color: white; font-weight: 500; border: none; position: relative;";

                            const delBtn = document.createElement("button");
                            delBtn.type = "button";
                            delBtn.className = "qa-delete-btn";
                            delBtn.innerText = "Delete Message";
                            delBtn.onclick = function () { deleteQaTurn(turnIndex, this); };

                            const feedDiv = document.createElement("div");
                            feedDiv.className = "agent-feed";
                            feedDiv.style.cssText = "font-size: 16px; color: white; font-weight: 500; overflow-y: visible; white-space: pre-wrap; word-break: break-word;";
                            feedDiv.textContent = val;

                            userMsg.appendChild(delBtn);
                            userMsg.appendChild(feedDiv);
                            chatLog.appendChild(userMsg);
                            BoardroomCore.scrollFeedToBottom(chatLog);

                            qaInput.value = "";
                            qaInput.style.height = "auto";
                            qaInput.style.overflowY = "hidden";
                            qaInput.disabled = true;
                            if (targetSelect) targetSelect.disabled = true;
                            sendBtn.disabled = true;
                            sendBtn.innerText = "Thinking...";

                            setTimeout(() => {
                                BoardroomCore.scrollFeedToBottom(chatLog);
                            }, 50);

                            window.sendWsMessage({
                                action: "qa_query",
                                query: val,
                                targetAgent: chosenTarget,
                                ticker: currentTicker,
                                simulatedDate: currentSimulatedDate
                            });
                        }
                    };

                    if (sendBtn) sendBtn.onclick = sendMsg;

                    qaInput.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" && !e.shiftKey) {
                            e.preventDefault();
                            sendMsg();
                        }
                    });
                }
            }, 100);
        }
    });

    function deleteQaTurn(turnIndex, btnEl) {
        const chatHistory = document.getElementById("qaChatHistory");
        if (!chatHistory) return;

        const userPane = btnEl.closest(".qa-user-pane");
        if (userPane) {
            let nextEl = userPane.nextElementSibling;
            while (nextEl) {
                const toRemove = nextEl;
                nextEl = nextEl.nextElementSibling;
                toRemove.remove();
            }
            userPane.remove();
        }

        qaTurnCounter = turnIndex;

        if (typeof window.sendWsMessage === "function") {
            window.sendWsMessage({
                action: "qa_delete_turn",
                turnIndex: turnIndex
            });
        }
    }

    // Custom Layout Handler for Decision Upload Stage
    BoardroomCore.setCustomStageLayoutHandler(({ stageNum, stageName, agents, workspace }) => {
        if (stageName.includes("Decision Upload")) {
            workspace.innerHTML = `
                <div class="upload-receipt-container" style="flex: 1; max-width: 440px; border: 3px solid #000; border-radius: 8px; background-color: #fff; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); align-self: stretch; height: 100%; min-height: 0; overflow-y: auto; box-sizing: border-box;">
                    <h2 style="font-size: 18px; font-weight: 800; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 16px; text-align: center;">BOARDROOM DECISION REPORT</h2>
                    <div style="display: grid; grid-template-columns: 160px 1fr; gap: 14px; font-size: 14px; line-height: 1.2;">
                        <div style="font-weight: 700; color: #475569;">Asset Ticker:</div>
                        <div id="receipt-ticker" style="font-weight: bold;">${currentTicker || '--'}</div>

                        <div style="font-weight: 700; color: #475569;">Date of Analysis:</div>
                        <div id="receipt-date" style="font-weight: bold;">${BoardroomCore.formatOrdinalDate(currentSimulatedDate)}</div>

                        <div style="font-weight: 700; color: #475569;">Investment Rating:</div>
                        <div><span id="receipt-rating" class="tool-status-badge status-running" style="font-size: 11px; margin-left: 0; font-weight: bold;">--</span></div>

                        <div style="font-weight: 700; color: #475569;">Portfolio Weighting:</div>
                        <div id="receipt-weighting" style="font-weight: bold;">--</div>

                        <div id="receipt-label-1" style="font-weight: 700; color: #475569;">12-Month Price Target:</div>
                        <div id="receipt-target-12" style="font-weight: bold;">--</div>

                        <div id="receipt-label-2" style="font-weight: 700; color: #475569;">3-Year Price Target:</div>
                        <div id="receipt-target-36" style="font-weight: bold;">--</div>

                        <div style="font-weight: 700; color: #475569;">Upload Status:</div>
                        <div><span id="receipt-status" class="tool-status-badge status-running" style="font-size: 11px; margin-left: 0; font-weight: bold;">PENDING UPLOAD</span></div>
                    </div>

                    <div id="receiptChartContainer" style="margin-top: 16px; width: 100%; position: relative; border: none; padding: 0; background-color: #ffffff; text-align: center;">
                        <canvas id="receiptChartCanvas" style="width: 100%; height: 210px; display: block;"></canvas>
                    </div>

                    <div id="finalTimeReportRow" style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #cbd5e1; display: none; text-align: center;">
                        <div style="font-size: 15px; font-weight: 700; color: #10b981; margin-bottom: 5px;">✓ Simulation Completed Successfully</div>
                        <div id="finalTimeReportValue" style="font-size: 13px; font-weight: 600; color: #475569;">Time Taken: Running...</div>
                    </div>
                </div>
            `;
            if (agents && agents.length > 0) {
                agents.forEach(agent => {
                    BoardroomCore.createAgentPane(stageNum, agent.role, agent.color, agent.name);
                });
            } else {
                BoardroomCore.createAgentPane(stageNum, "Impartial Portfolio Manager", "magenta", "Portfolio Manager");
            }

            setTimeout(() => {
                renderStageChart();
            }, 50);
            return true;
        }
        return false;
    });

    // Update Decision Report Card
    function updateUploadReceipt(dataString, status) {
        let data = {};
        try {
            data = (typeof dataString === "string") ? JSON.parse(dataString) : (dataString || {});
        } catch (e) {
            console.error("Failed to parse tool arguments for receipt", e);
        }

        const tickerVal = data.ticker || currentTicker || "--";
        const ratingVal = data.rating || "--";
        const weightingVal = data.weighting || "--";

        let label1 = "12-Month Price Target:";
        let label2 = "3-Year Price Target:";
        let val1 = "--";
        let val2 = "--";
        let months1 = "12";
        let months2 = "36";

        if (data.oneMonthTarget !== undefined && data.threeMonthTarget !== undefined) {
            label1 = "1-Month Price Target:"; val1 = data.oneMonthTarget; months1 = "1";
            label2 = "3-Month Price Target:"; val2 = data.threeMonthTarget; months2 = "3";
        } else if (data.threeMonthTarget !== undefined && data.twelveMonthTarget !== undefined) {
            label1 = "3-Month Price Target:"; val1 = data.threeMonthTarget; months1 = "3";
            label2 = "12-Month Price Target:"; val2 = data.twelveMonthTarget; months2 = "12";
        } else if (data.twelveMonthTarget !== undefined && data.threeYearTarget !== undefined) {
            label1 = "12-Month Price Target:"; val1 = data.twelveMonthTarget; months1 = "12";
            label2 = "3-Year Price Target:"; val2 = data.threeYearTarget; months2 = "36";
        } else if (data.threeYearTarget !== undefined && data.tenYearTarget !== undefined) {
            label1 = "3-Year Price Target:"; val1 = data.threeYearTarget; months1 = "36";
            label2 = "10-Year Price Target:"; val2 = data.tenYearTarget; months2 = "120";
        } else {
            val1 = data.twelveMonthTarget || "--";
            val2 = data.threeYearTarget || "--";
        }

        if (val1 !== "--" && !String(val1).startsWith("$")) val1 = `$${val1}`;
        if (val2 !== "--" && !String(val2).startsWith("$")) val2 = `$${val2}`;

        const tickerEl = document.getElementById("receipt-ticker");
        const dateEl = document.getElementById("receipt-date");
        const ratingEl = document.getElementById("receipt-rating");
        const weightingEl = document.getElementById("receipt-weighting");
        const label1El = document.getElementById("receipt-label-1");
        const label2El = document.getElementById("receipt-label-2");
        const target12El = document.getElementById("receipt-target-12");
        const target36El = document.getElementById("receipt-target-36");
        const statusEl = document.getElementById("receipt-status");

        if (tickerEl) tickerEl.innerText = tickerVal;
        if (dateEl) dateEl.innerText = BoardroomCore.formatOrdinalDate(currentSimulatedDate);

        if (ratingEl) {
            ratingEl.innerText = ratingVal;
            ratingEl.className = "tool-status-badge";
            if (ratingVal === "BUY" || ratingVal === "OVERWEIGHT" || ratingVal === "STRONG BUY") {
                ratingEl.classList.add("status-success");
            } else if (ratingVal === "SELL" || ratingVal === "UNDERWEIGHT" || ratingVal === "STRONG SELL") {
                ratingEl.classList.add("status-error");
            } else {
                ratingEl.classList.add("status-running");
            }
        }

        if (weightingEl) weightingEl.innerText = weightingVal;
        if (label1El) label1El.innerText = label1;
        if (label2El) label2El.innerText = label2;
        if (target12El) {
            target12El.innerText = val1;
            target12El.dataset.months = months1;
        }
        if (target36El) {
            target36El.innerText = val2;
            target36El.dataset.months = months2;
        }

        if (statusEl) {
            statusEl.innerText = status;
            statusEl.className = "tool-status-badge";
            if (status === "UPLOADED" || status === "SUCCESS") {
                statusEl.classList.add("status-success");
            } else if (status === "FAILED") {
                statusEl.classList.add("status-error");
            } else {
                statusEl.classList.add("status-running");
            }
        }

        renderStageChart();
    }

    // Chart Plugin & Formatting
    const simDateLinePlugin = {
        id: "simDateLine",
        afterDraw: (chart) => {
            const simDate = chart.config.options.simDate;
            if (!simDate) return;
            const xAxis = chart.scales.x;
            const yAxis = chart.scales.y;
            if (!xAxis || !yAxis) return;
            const simTime = (typeof simDate === "string" && simDate.length === 10) ? new Date(simDate + "T00:00:00").getTime() : simDate;
            const xPixel = xAxis.getPixelForValue(simTime);
            if (xPixel !== undefined && xPixel >= xAxis.left && xPixel <= xAxis.right) {
                const ctx = chart.ctx;
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = "#1e293b";
                ctx.lineWidth = 1.5;
                ctx.moveTo(xPixel, yAxis.top);
                ctx.lineTo(xPixel, yAxis.bottom);
                ctx.stroke();
                ctx.restore();
            }
        }
    };

    function countDecimalPlaces(num) {
        if (!num || Math.floor(num) === num) return 0;
        const str = num.toString();
        if (str.indexOf("e-") !== -1) return parseInt(str.split("e-")[1], 10);
        if (str.indexOf(".") !== -1) return str.split(".")[1].length;
        return 0;
    }

    function formatYAxisLabel(val, stepSize) {
        if (val === 0) return "$0";
        const absVal = Math.abs(val);
        let unit = "";
        let div = 1;

        if (absVal >= 1e12) { unit = "T"; div = 1e12; }
        else if (absVal >= 1e9) { unit = "B"; div = 1e9; }
        else if (absVal >= 1e6) { unit = "M"; div = 1e6; }
        else if (absVal >= 1e3) { unit = "k"; div = 1e3; }

        const num = val / div;
        let dp = 0;
        if (stepSize && stepSize > 0) {
            dp = countDecimalPlaces(stepSize / div);
        } else {
            dp = countDecimalPlaces(num);
        }
        dp = Math.max(0, Math.min(6, dp));

        let minDp = (div === 1 && stepSize && stepSize < 1) ? 2 : 0;
        const formattedStr = num.toLocaleString("en-US", {
            minimumFractionDigits: minDp,
            maximumFractionDigits: dp
        });

        return "$" + formattedStr + unit;
    }

    function createOrUpdateChart(chartData) {
        const canvas = document.getElementById("receiptChartCanvas");
        if (!canvas) return;

        if (stageChartInstance) {
            stageChartInstance.destroy();
            stageChartInstance = null;
        }

        const datasets = [];

        if (chartData.historical && chartData.historical.length > 0) {
            datasets.push({
                label: "Historical",
                data: chartData.historical,
                borderColor: "#2563eb",
                borderWidth: 1.8,
                backgroundColor: "rgba(37, 99, 235, 0.08)",
                fill: "start",
                tension: 0.1,
                pointRadius: 0,
                pointHoverRadius: 3,
                clip: false
            });
        }

        if (chartData.futureChunks && chartData.futureChunks.length > 0) {
            chartData.futureChunks.forEach(chunk => {
                const color = chunk.color || "#f43f5e";
                const isGreen = color === "#10b981";
                datasets.push({
                    label: isGreen ? "Outperforming" : "Underperforming",
                    data: chunk.points,
                    borderColor: color,
                    borderWidth: 1.8,
                    backgroundColor: isGreen ? "rgba(16, 185, 129, 0.08)" : "rgba(244, 63, 94, 0.08)",
                    fill: "start",
                    tension: 0.1,
                    pointRadius: 0,
                    pointHoverRadius: 3,
                    clip: false
                });
            });
        }

        if (chartData.targetCurve && chartData.targetCurve.length > 0) {
            datasets.push({
                label: "Prediction Curve",
                data: chartData.targetCurve,
                borderColor: "#06b6d4",
                borderWidth: 2.8,
                fill: false,
                tension: 0,
                pointRadius: 0,
                pointHoverRadius: 0,
                clip: false
            });
        }

        if (chartData.targetPoints && chartData.targetPoints.length > 0) {
            datasets.push({
                label: "Target Points",
                data: chartData.targetPoints,
                borderColor: "#ffffff",
                borderWidth: 1.5,
                backgroundColor: "#06b6d4",
                pointRadius: 6,
                pointHoverRadius: 8,
                showLine: false,
                clip: false
            });
        }

        if (chartData.simAnchor) {
            datasets.push({
                label: "Analysis Date",
                data: [chartData.simAnchor],
                borderColor: "#ffffff",
                borderWidth: 1,
                backgroundColor: "#64748b",
                pointRadius: 4,
                pointHoverRadius: 6,
                showLine: false,
                clip: false
            });
        }

        const ctx = canvas.getContext("2d");
        stageChartInstance = new Chart(ctx, {
            type: "line",
            data: { datasets: datasets },
            plugins: [simDateLinePlugin],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                layout: { padding: { left: 5, right: 25, top: 10, bottom: 0 } },
                simDate: chartData.simDate,
                interaction: { mode: "nearest", intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (context) => `${context.dataset.label}: $${context.parsed.y.toFixed(2)}`
                        }
                    }
                },
                scales: {
                    x: {
                        type: "time",
                        time: {
                            tooltipFormat: "yyyy-MM-dd",
                            displayFormats: {
                                day: "MMM d ''yy",
                                week: "MMM d ''yy",
                                month: "MMM ''yy",
                                quarter: "MMM ''yy",
                                year: "yyyy"
                            }
                        },
                        min: chartData.startDate ? new Date(chartData.startDate + "T00:00:00").getTime() : undefined,
                        max: chartData.endDate ? new Date(chartData.endDate + "T00:00:00").getTime() : undefined,
                        grid: { display: false },
                        ticks: { color: "#64748b", font: { weight: "600", size: 10 }, maxTicksLimit: 7 },
                        border: { display: false }
                    },
                    y: {
                        suggestedMin: chartData.yMin,
                        suggestedMax: chartData.yMax,
                        grid: { color: "rgba(226, 232, 240, 0.8)", drawBorder: false, lineWidth: 1 },
                        ticks: {
                            color: "#64748b",
                            font: { weight: "600", size: 10 },
                            callback: (val) => formatYAxisLabel(val)
                        },
                        border: { display: false }
                    }
                }
            }
        });
    }

    async function renderStageChart() {
        const canvas = document.getElementById("receiptChartCanvas");
        if (!canvas) return;

        const ticker = currentTicker || document.getElementById("tickerInput")?.value.trim().toUpperCase() || "NVDA";
        let simDateStr = currentSimulatedDate;
        if (!simDateStr) {
            const simCheckbox = document.getElementById("simulatedDateCheckbox");
            if (simCheckbox && simCheckbox.checked) {
                simDateStr = document.getElementById("simulatedDateInput").value;
            }
        }
        if (!simDateStr) {
            simDateStr = new Date().toISOString().split("T")[0];
        }

        const t12El = document.getElementById("receipt-target-12");
        const t36El = document.getElementById("receipt-target-36");
        const targets = [];
        if (t12El && t12El.innerText && t12El.innerText !== "--") {
            const val = t12El.innerText.trim().replace("$", "");
            const m = t12El.dataset.months || "12";
            if (val) targets.push(`${m}:${val}`);
        }
        if (t36El && t36El.innerText && t36El.innerText !== "--") {
            const val = t36El.innerText.trim().replace("$", "");
            const m = t36El.dataset.months || "36";
            if (val) targets.push(`${m}:${val}`);
        }

        const horizon = document.getElementById("horizonSelect") ? document.getElementById("horizonSelect").value : "long";
        try {
            let url = `/api/ohlcv?ticker=${encodeURIComponent(ticker)}&simDate=${encodeURIComponent(simDateStr)}&horizon=${encodeURIComponent(horizon)}`;
            if (targets.length > 0) {
                url += `&targets=${encodeURIComponent(targets.join(","))}`;
            }
            const res = await fetch(url);
            if (res.ok) {
                const data = await res.json();
                createOrUpdateChart(data);
            }
        } catch (e) {
            console.error("Failed to fetch OHLCV chart data:", e);
        }
    }

    // Lifecycle Listeners
    BoardroomCore.on("simulationStarted", (payload) => {
        initQaChatHistory();
        const qaTab = document.getElementById("stageStep-qa");
        if (qaTab) {
            qaTab.style.display = "none";
            qaTab.classList.add("disabled");
        }
    });

    BoardroomCore.on("decisionStarted", (payload) => {
        updateUploadReceipt(payload.args, "PENDING UPLOAD");
    });

    BoardroomCore.on("decisionConfirmed", (payload) => {
        updateUploadReceipt(payload.result, payload.status === "success" ? "UPLOADED" : "FAILED");
    });

    BoardroomCore.on("qaComplete", () => {
        const qSendBtn = document.getElementById("qaSendBtn");
        const qInput = document.getElementById("qaInput");
        const qTargetSelect = document.getElementById("qaTargetSelect");
        if (qSendBtn) { qSendBtn.disabled = false; qSendBtn.innerText = "Send"; }
        if (qInput) { qInput.disabled = false; qInput.focus(); }
        if (qTargetSelect) qTargetSelect.disabled = false;
    });

    BoardroomCore.on("simComplete", (payload) => {
        updateQaTargetAgents();
        const finalTimeRow = document.getElementById("finalTimeReportRow");
        if (finalTimeRow) {
            finalTimeRow.style.display = "block";
            const finalTimeVal = document.getElementById("finalTimeReportValue");
            if (finalTimeVal && payload.totalTime) {
                finalTimeVal.innerText = "Time Taken: " + payload.totalTime;
            }
        }
    });

    BoardroomCore.on("simStopped", () => {
        const qStopBtn = document.getElementById("qaSendBtn");
        const qStopInp = document.getElementById("qaInput");
        const qTargetSelect = document.getElementById("qaTargetSelect");
        if (qStopBtn) { qStopBtn.disabled = false; qStopBtn.innerText = "Send"; }
        if (qStopInp) qStopInp.disabled = false;
        if (qTargetSelect) qTargetSelect.disabled = false;
    });

    BoardroomCore.on("error", () => {
        const qErrBtn = document.getElementById("qaSendBtn");
        const qErrInp = document.getElementById("qaInput");
        const qTargetSelect = document.getElementById("qaTargetSelect");
        if (qErrBtn) { qErrBtn.disabled = false; qErrBtn.innerText = "Send"; }
        if (qErrInp) qErrInp.disabled = false;
        if (qTargetSelect) qTargetSelect.disabled = false;
    });

    // Initialize Core Engine
    BoardroomCore.init({
        defaultStages: singleEquityStages,
        initialMode: document.getElementById("modeSelect")?.value || "fast",
        getPayload: () => {
            const ticker = document.getElementById("tickerInput").value.trim().toUpperCase();
            if (!ticker) {
                alert("Please enter a valid stock ticker symbol.");
                return null;
            }
            currentTicker = ticker;

            const mode = document.getElementById("modeSelect").value;
            const horizon = document.getElementById("horizonSelect").value;

            let simDate = null;
            const simCheckbox = document.getElementById("simulatedDateCheckbox");
            if (simCheckbox && simCheckbox.checked) {
                simDate = document.getElementById("simulatedDateInput").value;
                if (!simDate) {
                    alert("Please select a valid simulated evaluation date.");
                    return null;
                }
            }
            currentSimulatedDate = simDate;

            return {
                action: "start",
                engineType: "single_equity",
                ticker: ticker,
                boardroomPace: mode,
                timeHorizon: horizon,
                simulatedDate: simDate,
                ...BoardroomCore.getGenerationSettings()
            };
        }
    });
</script>
{% endblock %}
